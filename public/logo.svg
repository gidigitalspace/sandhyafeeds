  <path d="M 58 132 C 75 126 90 138 110 132 C 128 126 142 138 152 132" fill="none" stroke="#bae6fd" stroke-width="3" stroke-linecap="round"/>

  <!-- Text SML -->
  <text x="100" y="174" font-family="Arial, Helvetica, sans-serif" font-weight="900" font-size="28" fill="#ffffff" text-anchor="middle" letter-spacing="3">SML FEEDS</text>
  <text x="100" y="190" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="10" fill="#fcd34d" text-anchor="middle" letter-spacing="1">SANDHYA FEEDS</text>
